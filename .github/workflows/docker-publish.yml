name: Build & Deploy Docker Images

on:
  push:
    branches: [dev, main]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Landing Page Image
        uses: docker/build-push-action@v6
        with:
          context: ./landing-page
          file: ./landing-page/Dockerfile
          push: true
          tags: |
            garoverr/primo-landing:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            garoverr/primo-frontend:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./back
          file: ./back/Dockerfile
          push: true
          tags: |
            garoverr/primo-backend:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
  deploy-frontend:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull image on VPS (Front-End)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            cd /home/ubuntu
            docker compose up -d --pull always
          EOF
  deploy-backend:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull image on Dedicated Server (Back-End)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEDICATED_SERVER_USER }}@${{ secrets.DEDICATED_SERVER_HOST }} << 'EOF'
            cd /home/ubuntu
            docker compose up -d --pull always
          EOF